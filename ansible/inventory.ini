# =============================================================================
#  AlphaPay — inventaire
# =============================================================================
#  Un seul hôte : le poste qui héberge la pile Docker. Sur le poste hôte du
#  sujet (Windows + WSL2), Ansible s'exécute dans WSL2 et pilote le démon Docker
#  Desktop exposé par le socket Unix.
#
#  Sur un démon Docker distant (environnement de test isolé), surchargez la
#  variable `docker_host` :
#
#      ansible-playbook -i inventory.ini playbooks/deploy.yml \
#          -e docker_host=tcp://dind:23757
# =============================================================================

[plateforme]
poste-hote ansible_connection=local

[plateforme:vars]
# Racine du dépôt sur l'hôte.
racine_projet="{{ lookup('env', 'PWD') }}"

# Point d'entrée de la pile, vu depuis l'hôte.
url_publique="http://localhost"

# Démon Docker utilisé. Vide = socket Unix par défaut.
docker_host="unix:///var/run/docker.sock"

# Nombre de secondes d'attente avant de considérer un service comme indisponible.
delai_sante=180

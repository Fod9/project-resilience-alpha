# =============================================================================
#  AlphaPay — configuration Ansible
# =============================================================================
#  Le déploiement vise le poste hôte lui-même (Windows + WSL2, ou Linux). La
#  connexion est donc locale : Ansible sert ici à décrire le déploiement de
#  manière idempotente et rejouable, non à administrer un parc distant.
# =============================================================================

[defaults]
inventory = inventory.ini
host_key_checking = False
retry_files_enabled = False
stdout_callback = yaml
bin_ansible_callbacks = True
interpreter_python = auto_silent
deprecation_warnings = False

[privilege_escalation]
become = False

[ssh_connection]
pipelining = True

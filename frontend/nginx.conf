# =============================================================================
#  AlphaPay : serveur statique de l'interface web
# =============================================================================
#  L'interface est une application à page unique : toute route inconnue doit
#  renvoyer `index.html`, sinon un rechargement sur `/ops` produirait une erreur
#  404 devant le jury. C'est exactement le genre de détail qui fait échouer une
#  démonstration sans que le code soit en cause.
# =============================================================================

server {
    listen 8080;
    server_name _;

    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Le service est derrière la bordure, qui a déjà appliqué le WAF. Ces
    # en-têtes complètent la défense en profondeur côté navigateur.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'self'" always;

    # Sonde de disponibilité, interrogée par le compose et par la remédiation.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "alphapay-web ok
";
    }

    # Les fichiers compilés portent une empreinte dans leur nom : ils peuvent
    # être mis en cache durablement. `index.html` ne doit jamais l'être, sous
    # peine de servir une version périmée après un redéploiement.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Repli de l'application à page unique.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

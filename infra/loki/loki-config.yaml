# =============================================================================
#  AlphaPay : Loki (journaux centralisés)
# =============================================================================
#  Choix assumé : Loki plutôt que la pile Elastic. Le sujet l'autorise
#  explicitement et le justifie par la mémoire disponible : dix-huit conteneurs
#  doivent tenir dans 12 Go. Loki indexe les étiquettes et non le contenu, ce
#  qui divise son empreinte mémoire par un ordre de grandeur par rapport à un
#  index inversé complet, au prix de recherches plein texte plus lentes. Sur un
#  exercice de quatre jours, ce compromis est le bon.
#
#  Aucun objet n'est envoyé vers un service externe : `retention_enabled` coupe
#  court à toute sortie de données.
# =============================================================================

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Les journaux les plus récents sont les plus utiles à la démonstration : une
  # rétention de sept jours borne le disque sans rien retirer d'exploitable.
  # `retention_enabled` n'existe pas à ce niveau en Loki 3 : l'activation se
  # fait dans la section `compactor` ci-dessous. Seule la durée est déclarée ici.
  retention_period: 168h
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  # Les services émettent plusieurs lignes par requête HTTP : la limite par
  # défaut provoquerait des rejets en rafale pendant une attaque, exactement au
  # moment où les journaux sont les plus précieux.
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  max_streams_per_user: 0
  max_query_series: 1000
  allow_structured_metadata: true

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 1h
  delete_request_store: filesystem

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules

analytics:
  reporting_enabled: false
